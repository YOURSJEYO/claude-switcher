name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shell, tests, Swift, sums
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n core/claude-switch.sh
          for file in daemons/*.sh; do
            bash -n "$file"
          done
          bash -n "installer/安装.command"
          bash -n "installer/卸载.command"
          for file in linux/*.sh; do
            bash -n "$file"
          done

      - name: Python tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Swift strict build
        run: |
          swiftc -O -parse-as-library -warnings-as-errors \
            -target "$(uname -m)-apple-macos13.0" \
            app/main.swift -o /tmp/ClaudeSwitcher \
            -framework SwiftUI -framework AppKit

      - name: Verify checksums
        run: shasum -a 256 -c SHA256SUMS

      - name: JavaScript syntax
        run: node --check docs/app.js

  windows:
    name: Windows PowerShell integration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Client language and ASN checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows-client-language-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows-asn-integration.ps1
          exit $LASTEXITCODE

      - name: Client language and ASN checks (pwsh 7)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests\windows-client-language-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests\windows-asn-integration.ps1
          exit $LASTEXITCODE

      # windows/ 下的两个隔离集成回归此前只写在 AGENTS.md 里，CI 从不执行，
      # 导致加密快照在 PS 5.1 下整体不可用仍能合入 main。两个 shell 都跑：
      # 5.1 是 Windows 用户的实际默认环境，7 是开发机常见环境。
      - name: Switch integration (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows-switch-integration.ps1

      - name: Snapshot integration (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows-snapshot-integration.ps1

      - name: Switch integration (pwsh 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests\windows-switch-integration.ps1

      - name: Snapshot integration (pwsh 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests\windows-snapshot-integration.ps1
